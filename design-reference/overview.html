<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>教师工作台设计稿总览</title><style>html,body{margin:0;background:#eeece6;color:#23322b;font-family:PingFang SC,Arial,sans-serif}.sheet{width:1600px;padding:54px 60px 62px;box-sizing:border-box}.top{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid #23322b;padding-bottom:22px;margin-bottom:28px}.top h1{font-family:Songti SC,serif;font-size:44px;font-weight:600;margin:0}.top span{font-size:14px;color:#777d76}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.tile{height:350px}.label{height:34px;font-size:16px;font-weight:600;display:flex;justify-content:space-between}.label small{color:#b84732;font-family:Georgia,serif;font-size:14px}.preview{height:308px;border:1px solid #c8c9c1;background:#f8f7f3;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.preview.mobile img{height:100%;width:auto}.bottom{border-top:1px solid #c8c9c1;margin-top:30px;padding-top:17px;font-size:13px;color:#777d76}</style></head><body><div class="sheet"><div class="top"><h1>六年级数学 · 页面设计稿</h1><span>统一版式 / 9 个页面与状态</span></div><div class="grid">
<div class="tile"><div class="label">今日工作台<small>00</small></div><div class="preview"><img src="00-home.png"></div></div>
<div class="tile"><div class="label">快速录错<small>01</small></div><div class="preview"><img src="01-fast-entry.png"></div></div>
<div class="tile"><div class="label">拍照批改<small>02</small></div><div class="preview"><img src="02-photo-ocr.png"></div></div>
<div class="tile"><div class="label">学情档案<small>03</small></div><div class="preview"><img src="03-student-tracking.png"></div></div>
<div class="tile"><div class="label">巩固单<small>04</small></div><div class="preview"><img src="04-consolidation-sheets.png"></div></div>
<div class="tile"><div class="label">逐题验收<small>05</small></div><div class="preview"><img src="05-monday-check.png"></div></div>
<div class="tile"><div class="label">母题库<small>06</small></div><div class="preview"><img src="06-mother-question-library.png"></div></div>
<div class="tile"><div class="label">教师登录<small>07</small></div><div class="preview"><img src="07-login.png"></div></div>
<div class="tile"><div class="label">手机上传<small>08</small></div><div class="preview mobile"><img src="08-mobile-upload.png"></div></div>
</div><div class="bottom">设计稿包含示例数据；完整尺寸请查看同目录单页图片。</div></div></body></html>
